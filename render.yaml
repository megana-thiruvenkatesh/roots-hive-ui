# HIVE Roots — Render Blueprint
# Deploy: Render Dashboard → Blueprints → New Blueprint Instance → connect this repo
# Creates: Postgres + backend API (Node/Express) + frontend (Vite static site)
#
# After first deploy, set these manually in the Render dashboard:
#   hive-roots-api  → CORS_ORIGIN, FRONTEND_URL (your static site URL)
#   hive-roots-web  → VITE_API_URL = https://<api-host>/api
# Then redeploy the frontend so Vite picks up VITE_API_URL at build time.
#
# DB setup (one time, Render Shell on hive-roots-api):
#   psql $DATABASE_URL -f ../database/schema.sql
#   npm run seed

databases:
  - name: hive-roots-db
    databaseName: hive_roots
    user: hive_roots
    plan: free

services:
  # ── Backend API (Express + PostgreSQL) ────────────────────────────────────
  - type: web
    name: hive-roots-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hive-roots-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEV_SHOW_OTP
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: MICROSOFT_DEV_LOGIN
        value: "false"
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CALLBACK_URL
        sync: false

  # ── Frontend (Vite React static site) ─────────────────────────────────────
  - type: web
    name: hive-roots-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
